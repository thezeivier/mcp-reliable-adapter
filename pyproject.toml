[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-reliable-adapter"
version = "0.1.0"
description = "A clean-room reference MCP adapter with durable delivery guarantees"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Fernando Beizaga"}]
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.2", "ruff>=0.8"]

[project.scripts]
mcp-reliable-adapter = "mcp_reliable_adapter.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_reliable_adapter"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
